name: CI

# C-06: there is no staging environment — this workflow is the only gate
# between a commit and production. Every job here is a hard block; none
# may carry continue-on-error (see docs/plan/00-conventions.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, always-on path classification so docs-only PRs skip the full
  # install/lint/typecheck/test toolchain (R-13: protects the 2,000
  # free-minutes/month budget) while still getting a doc-appropriate gate.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # dorny/paths-filter resolves a pull_request's changed files via the
    # GitHub REST API (listFiles), not a local git diff — that call 403s
    # ("Resource not accessible by integration") without pull-requests:
    # read, which the workflow-level `contents: read` block doesn't grant.
    # Job-level permissions replace, not merge with, the workflow-level
    # block, so contents: read has to be restated here too.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          # some-with-excludes: a file counts if it matches at least one
          # positive pattern and none of the negated ones. The default
          # ('some') would make `code` true on every diff, since the bare
          # '**' alone already satisfies "at least one pattern matches" —
          # the negations would be silently inert.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            docs:
              - 'docs/**'
              - '**/*.md'

  quality:
    name: Lint, typecheck, test, coverage, audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Integration tests
        run: pnpm run test:integration
      - name: Coverage thresholds
        run: pnpm run test:coverage
      - name: Dependency audit
        run: pnpm run audit

  docs-lint:
    name: Markdown lint + link check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: 'docs/**/*.md'
      - name: Link check (internal cross-references only)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # --offline: this repo's docs link to environments that don't
          # exist until later gates (e.g. TASK 0.4.1's staging hostname)
          # and to account-specific AWS console URLs — checking those over
          # the network would make the gate flaky by design, not by bug.
          # Offline mode still catches the real failure mode a docs "link
          # check" exists for here: a typo'd relative path between the
          # manifest docs (§0.5 files cross-referencing each other).
          args: --offline --no-progress 'docs/**/*.md'
          fail: true

  # Not gated on the code/docs path filter: a secret can land in any file.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${version}_checksums.txt"
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks detect --source . --redact -v

  # Closes the loop on TASK 0.1.1's own deferred test ("assume ndn-deploy
  # from a CI dry-run"; see docs/runbooks/aws-account-baseline.md) — with
  # one correction made during a security review (TASK 0.2.1 follow-up).
  # ndn-deploy's trust policy originally accepted the generic
  # `repo:...:pull_request` OIDC subject, which is not scoped by author or
  # fork: anyone able to open a PR against this repo could assume a
  # PowerUserAccess role on account 357601815388 from their own PR branch.
  # ndn-deploy's trust is now `ref:refs/heads/main` only. PR-time checks
  # instead assume ndn-ci-readonly, a role trusted only for `pull_request`
  # and holding exactly one permission — `iam:SimulatePrincipalPolicy`
  # scoped to ndn-deploy's ARN — so this job proves ndn-deploy's
  # least-privilege from a distance, without a PR run ever holding
  # ndn-deploy's actual credentials. Role ARNs are not secrets (account
  # 357601815388 is already documented in committed runbooks) so they are
  # inlined rather than gated behind repo configuration nobody has set up.
  #
  # Runs on pull_request only: ndn-ci-readonly's trust condition doesn't
  # match a push-to-main subject, and there is nothing on main yet that
  # needs this check (no deploy job exists before TASK 0.4.1).
  #
  # First landed NOT included in the required-checks gate below, since it
  # was the first time either trust policy was exercised from an actual
  # Actions run rather than a manual `simulate-principal-policy` call. It
  # failed on every real run: GitHub's *current default* OIDC sub claim
  # embeds immutable org/repo IDs — `repo:nourishthenerve@252558973/
  # ndn-monolithic@1327118618:pull_request`, not the plain-name
  # `repo:nourishthenerve/ndn-monolithic:pull_request` both this role's and
  # ndn-deploy's trust policies were written against (confirmed by decoding
  # a real issued token and cross-checked against `GET /repos/{owner}/
  # {repo}/actions/oidc/customization/sub`, which reports `use_default:
  # true` and exposes the exact prefix GitHub now issues). Both trust
  # policies were corrected against the live AWS account to match; now
  # gated in ci-summary below.
  oidc-dry-run:
    name: OIDC deploy-role dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # id-token: write alone would drop the workflow-level `contents: read`
      # (job-level permissions replace, not merge — the same gotcha the
      # `changes` job's own comment above documents) and the new guardrail
      # step below needs to read the fixture file via actions/checkout.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::357601815388:role/ndn-ci-readonly
          aws-region: eu-west-2
      - name: Prove ndn-deploy's least-privilege without ever holding its credentials
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          result=$(aws iam simulate-principal-policy \
            --policy-source-arn arn:aws:iam::357601815388:role/ndn-deploy \
            --action-names cloudformation:DescribeStacks iam:CreateUser \
            --query 'EvaluationResults[].[EvalActionName,EvalDecision]' \
            --output text)
          echo "$result"
          echo "$result" | grep -qE '^cloudformation:DescribeStacks[[:space:]]+allowed$'
          echo "$result" | grep -qE '^iam:CreateUser[[:space:]]+implicitDeny$'
      # TASK 0.3.2 (IAM deny guardrails): proves guardrails.ts's Deny
      # statement against the real IAM policy evaluation engine, not a
      # mock of it — ndn-ci-readonly holds iam:SimulateCustomPolicy
      # (resource "*": this action evaluates an arbitrary policy document
      # you pass in, so there is no existing entity to scope it to; it
      # performs no action and touches no real resource). The policy
      # document is the checked-in fixture infra/src/__fixtures__/
      # guardrails/example-runtime-policy.json — guardrails.test.ts's
      # freshness test fails the `quality` job if it ever drifts from
      # guardrails.ts's actual output, so a stale fixture can't quietly
      # make this step meaningless.
      - name: Prove the destructive-action guardrail against the real IAM engine
        run: |
          set -euo pipefail
          jq -c '[tojson]' infra/src/__fixtures__/guardrails/example-runtime-policy.json \
            > /tmp/guardrail-policy-input-list.json
          result=$(aws iam simulate-custom-policy \
            --policy-input-list file:///tmp/guardrail-policy-input-list.json \
            --action-names s3:DeleteObject s3:DeleteObjectVersion dynamodb:DeleteItem dynamodb:DeleteTable s3:PutObject dynamodb:PutItem \
            --resource-arns arn:aws:s3:::ndn-example-media/example-key arn:aws:dynamodb:eu-west-2:357601815388:table/ndn-example-data \
            --query 'EvaluationResults[].[EvalActionName,EvalDecision]' \
            --output text)
          echo "$result"
          for action in s3:DeleteObject s3:DeleteObjectVersion dynamodb:DeleteItem dynamodb:DeleteTable; do
            echo "$result" | grep -qE "^${action}[[:space:]]+explicitDeny\$"
          done
          for action in s3:PutObject dynamodb:PutItem; do
            echo "$result" | grep -qE "^${action}[[:space:]]+allowed\$"
          done

  # TASK 0.6.3: the ephemeral-environment half of D-19's pre-production
  # confidence stack (R-08). Deploys a uniquely-named, PR-scoped stack
  # (NdnWebStackPr<number>, infra/bin/app.ts's PR_NUMBER branch), proves it
  # for real — integration + contract + a11y against the live URL — then
  # destroys it, in the same run, even on failure, via always().
  #
  # ndn-deploy-pr's own IAM policy (docs/runbooks/
  # ephemeral-pr-environments.md) can only assume the same CDK bootstrap
  # roles ndn-deploy already uses for production — it holds no
  # PowerUserAccess and no permissions of its own beyond that. The
  # `--exclusively` flag on every cdk command below is a second,
  # workflow-level layer of the same boundary: this job's own intent is
  # never to touch NdnWebStack/NdnBudgetStack, even though the underlying
  # bootstrap roles technically could reach them (see the runbook's
  # documented trade-off — reusing that shared, unscoped bootstrap path was
  # a deliberate, sign-off-required decision, not an oversight).
  #
  # Landed informational-only for now (excluded from ci-summary's required
  # gate below) — same "watch the first real run before promoting" pattern
  # ci-pipeline.md already used for oidc-dry-run's own first landing: this
  # is the first time ndn-deploy-pr's OIDC trust and a full live CloudFront
  # deploy/destroy cycle are exercised from an actual Actions run rather
  # than a local admin-profile proof.
  pr-environment:
    name: Ephemeral PR environment
    needs: [changes, quality]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # CloudFront distribution create/delete each take up to ~15 minutes
    # (docs/runbooks/iac-baseline.md) — deploy, wait, test, and destroy
    # together can approach that twice over.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::357601815388:role/ndn-deploy-pr
          aws-region: eu-west-2
      - name: cdk deploy (this PR's ephemeral stack only)
        working-directory: infra
        run: |
          set -euo pipefail
          npx cdk deploy "NdnWebStackPr${PR_NUMBER}" --exclusively --require-approval never \
            --outputs-file /tmp/pr-env-outputs.json
      - name: Wait for the distribution to actually serve, then export its URL
        run: |
          set -euo pipefail
          domain=$(jq -r '.[].DistributionDomainName' /tmp/pr-env-outputs.json)
          echo "PR_ENV_BASE_URL=https://${domain}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://${domain}/health" || true)
            [ "$status" = "200" ] && break
            echo "waiting for https://${domain}/health (attempt ${attempt}, got ${status:-none})"
            sleep 15
          done
          curl -sf "https://${domain}/health"
      - name: Integration + contract + a11y tests against the live stack
        run: pnpm run test:pr-env
      # TASK 0.6.3 DoD: "destroys it in the same run (including on
      # failure, via always())" — this step and the one below both run
      # regardless of whether deploy/wait/test above succeeded.
      - name: cdk destroy (always — even if the steps above failed)
        if: always()
        working-directory: infra
        run: npx cdk destroy "NdnWebStackPr${PR_NUMBER}" --exclusively --force
      - name: Assert this PR's stack leaves zero standing cost
        if: always()
        run: |
          set -euo pipefail
          # Scoped to exactly this PR's own stack name, not every
          # NdnWebStackPr* stack in the account — a second PR's job can be
          # mid-deploy concurrently (different ref, so not cancelled by
          # this workflow's own concurrency group), and that stack existing
          # is correct, not a leak this run should fail on.
          status=$(aws cloudformation describe-stacks --stack-name "NdnWebStackPr${PR_NUMBER}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$status" != "NOT_FOUND" ] && [ "$status" != "DELETE_COMPLETE" ]; then
            echo "NdnWebStackPr${PR_NUMBER} still exists (status: ${status}) — not zero standing cost." >&2
            exit 1
          fi
          echo "NdnWebStackPr${PR_NUMBER}: ${status} — zero standing cost confirmed."

  # TASK 0.4.1: first real deploy job. CI is the only gate (C-06) — a green
  # `quality` run on push to main is what takes the CDK stack (S3 site
  # bucket, CloudFront, HTTP API + health Lambda — see infra/src/web-stack.ts)
  # to production, via ndn-deploy's OIDC role. Skipped on pull_request:
  # ndn-deploy's trust policy is scoped to ref:refs/heads/main only (see the
  # security fix above), so a PR-time run couldn't assume it even if this
  # job's `if` allowed the attempt.
  deploy:
    name: Deploy to production
    needs: [changes, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::357601815388:role/ndn-deploy
          aws-region: eu-west-2
      - name: cdk deploy
        working-directory: infra
        run: pnpm run deploy

  # Single required status check: the underlying jobs are conditionally
  # skipped per path filter, which GitHub treats as passing for branch
  # protection — that's correct for *them*, but branch protection needs
  # one check name that's always present to point at.
  ci-summary:
    name: CI summary
    needs: [changes, quality, docs-lint, secret-scan, oidc-dry-run, pr-environment, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Print CI minutes used
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## CI minutes used this run (ubuntu runners bill 1:1)"
            echo
            echo "| Job | Duration |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          total=0
          while IFS=$'\t' read -r name started completed; do
            s=$(date -d "$started" +%s)
            e=$(date -d "$completed" +%s)
            d=$(( e - s ))
            total=$(( total + d ))
            printf '| %s | %dm%02ds |\n' "$name" "$(( d / 60 ))" "$(( d % 60 ))" >> "$GITHUB_STEP_SUMMARY"
          done < <(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.completed_at != null) | [.name, .started_at, .completed_at] | @tsv')
          printf '| **Total** | **%dm%02ds** |\n' "$(( total / 60 ))" "$(( total % 60 ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Gate on required jobs
        run: |
          set -euo pipefail
          echo "changes:        ${{ needs.changes.result }}"
          echo "quality:        ${{ needs.quality.result }}"
          echo "docs-lint:      ${{ needs.docs-lint.result }}"
          echo "secret-scan:    ${{ needs.secret-scan.result }}"
          echo "oidc-dry-run:   ${{ needs.oidc-dry-run.result }}"
          # TASK 0.6.3: informational only, not yet gated — see the
          # pr-environment job's own header comment for why (same
          # first-landing pattern as oidc-dry-run originally used).
          echo "pr-environment: ${{ needs.pr-environment.result }} (informational — not yet gating)"
          echo "deploy:         ${{ needs.deploy.result }}"
          fail=0
          [ "${{ needs.changes.result }}" = "success" ] || fail=1
          # oidc-dry-run and pr-environment run on pull_request only; deploy
          # runs on push to main only (and only when code changed) — each
          # is `skipped` on the other's trigger by design, not a gap.
          for r in "${{ needs.quality.result }}" "${{ needs.docs-lint.result }}" "${{ needs.secret-scan.result }}" "${{ needs.oidc-dry-run.result }}" "${{ needs.deploy.result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "One or more required CI gates failed." >&2
            exit 1
          fi
          echo "All required CI gates passed (or were correctly skipped for this diff)."
