packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'infra'
  - 'tests'
# TASK 1.1.1: nanoid@3.3.17 (GHSA-2v37-7h3g-55p8, high) is a transitive
# devDependency reached via postcss (vite, pulled in by both vitest and
# Astro) — never invoked with attacker-controlled input in this repo, but
# `pnpm audit --audit-level=high` (00-conventions.md's required gate,
# TASK 0.2.1) doesn't distinguish dev from prod. Pinned past the patched
# version rather than left to fail CI on every future PR.
# Core Web Vitals tooling: `@lhci/cli` reaches two more high advisories
# the same way — dev-only, never invoked on attacker-controlled input, and
# invisible to `pnpm audit --audit-level=high`'s dev/prod blindness.
#   tmp <0.2.6 (GHSA-ph9p-34f9-6g65) via @lhci/cli and inquirer >
#     external-editor. A patched 0.2.7 exists; pinned past it.
#   extract-zip <=2.0.1 (GHSA-jmr9-qjv8-65gv) via
#     lighthouse > puppeteer-core > @puppeteer/browsers. There is no fixed
#     release — the advisory names >=2.0.2 and npm's latest is 2.0.1, so
#     the package cannot be bumped out of the vulnerability. It can be
#     removed instead: @puppeteer/browsers dropped extract-zip in v3
#     (it uses modern-tar now), so the override is on the parent, not the
#     vulnerable package. Verified after pinning that `pnpm cwv` still
#     runs a full Lighthouse collection — the v2->v3 API change is in
#     browser *downloading*, which this never does (it launches the
#     system Chrome via CHROME_PATH).
#   Found at Gate G3 review: uuid <11.1.1 (GHSA-w5hq-g745-h8pq, moderate)
#     via @lhci/cli's own direct dependency (0.15.1, latest — no newer
#     release fixes this upstream). Missing bounds check applies only when
#     a caller passes its own output buffer to v3/v5/v6; @lhci/cli never
#     does. Pinned past the patched version; v8->v11 keeps the same named
#     CJS/ESM exports lhci relies on, verified by re-running the full
#     install and test suite after the bump.
#   Found at TASK 4.2.1: adding @aws-sdk/client-apigatewaymanagementapi
#     (even pinned to the same 3.1109.0 release train as every other
#     @aws-sdk/client-* package here) pulled a second copy of
#     @smithy/types (4.17.2 alongside the rest of the tree's 4.17.0) —
#     not a vulnerability, a structural-typing break: two installed
#     copies of the same interface are nominally different types to
#     TypeScript, so DynamoDBDocumentClient/PutCommand/etc. stopped
#     type-checking against each other across every file that constructs
#     one. Pinned to the version already used everywhere else so pnpm
#     converges on one copy; @smithy/types has no runtime code (interfaces
#     only), so this is safe to force regardless of which package asked
#     for the newer one.
overrides:
  nanoid: '^3.3.18'
  tmp: '^0.2.7'
  '@puppeteer/browsers': '^3.2.1'
  uuid: '^11.1.1'
  '@smithy/types': '4.17.0'
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@esbuild/aix-ppc64@0.28.2'
  - '@esbuild/android-arm64@0.28.2'
  - '@esbuild/android-arm@0.28.2'
  - '@esbuild/android-x64@0.28.2'
  - '@esbuild/darwin-arm64@0.28.2'
  - '@esbuild/darwin-x64@0.28.2'
  - '@esbuild/freebsd-arm64@0.28.2'
  - '@esbuild/freebsd-x64@0.28.2'
  - '@esbuild/linux-arm64@0.28.2'
  - '@esbuild/linux-arm@0.28.2'
  - '@esbuild/linux-ia32@0.28.2'
  - '@esbuild/linux-loong64@0.28.2'
  - '@esbuild/linux-mips64el@0.28.2'
  - '@esbuild/linux-ppc64@0.28.2'
  - '@esbuild/linux-riscv64@0.28.2'
  - '@esbuild/linux-s390x@0.28.2'
  - '@esbuild/linux-x64@0.28.2'
  - '@esbuild/netbsd-arm64@0.28.2'
  - '@esbuild/netbsd-x64@0.28.2'
  - '@esbuild/openbsd-arm64@0.28.2'
  - '@esbuild/openbsd-x64@0.28.2'
  - '@esbuild/openharmony-arm64@0.28.2'
  - '@esbuild/sunos-x64@0.28.2'
  - '@esbuild/win32-arm64@0.28.2'
  - '@esbuild/win32-ia32@0.28.2'
  - '@esbuild/win32-x64@0.28.2'
  - esbuild@0.28.2
  - astro-eslint-parser@3.1.0
